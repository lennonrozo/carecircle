<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Alerts — CareCircle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --sage: #4A7C6F;
  --sage-light: #E8F2EF;
  --sage-mid: #A8CBB8;
  --warm: #C67D5A;
  --warm-light: #F7EDE5;
  --navy: #1E3A4F;
  --muted: #8A96A3;
  --surface: #FAFAF8;
  --card: #FFFFFF;
  --border: rgba(74,124,111,0.15);
  --text: #1E2D3A;
  --slate: #4A5568;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); }
.app { display: flex; flex-direction: column; min-height: 100vh; max-width: 980px; margin: 0 auto; padding: 0 0 40px; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: var(--navy); position: sticky; top: 0; z-index: 100; }
.nav-brand { display: flex; align-items: center; gap: 10px; transition: opacity 0.2s; }
.nav-brand:hover { opacity: 0.8; }
.nav-logo { width: 28px; height: 28px; }
.nav-brand span { font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-back { background: rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; text-decoration: none; transition: background 0.2s; }
.nav-back:hover { background: rgba(255,255,255,0.3); }
.role-badge { background: var(--sage); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
.page { padding: 32px 28px; }
.header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
.welcome-sub { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.page-title { font-family: 'Lora', serif; font-size: 28px; font-weight: 600; color: var(--navy); margin-bottom: 8px; }
.page-copy { font-size: 14px; color: var(--muted); max-width: 520px; line-height: 1.6; }
.alerts-grid { display: grid; gap: 16px; }
.alert-card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 20px; }
.alert-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
.alert-title { font-size: 18px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
.alert-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.pill-watch { background: #FFF4E8; color: var(--warm); }
.pill-info { background: #EBF4FB; color: #5B9BD6; }
.pill-urgent { background: #FBEAEA; color: #C55252; }
.pill-active { background: var(--sage-light); color: var(--sage); }
.pill-addressed { background: #EEF6F2; color: #3D6F62; }
.pill-dismissed { background: #F3F4F6; color: #6B7280; }
.alert-message { color: var(--slate); font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
.alert-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.alert-time { font-size: 12px; color: var(--muted); }
.alert-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: none; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--sage); }
.btn-secondary { background: var(--sage-light); color: var(--sage); }
.btn-secondary:hover { background: var(--sage-mid); }
.btn-warm { background: var(--warm-light); color: var(--warm); }
.btn-warm:hover { background: #f0ddd0; }
.modal-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); z-index: 1000; }
.modal-overlay.open { display: flex; }
.modal { width: min(560px, 92vw); background: var(--card); border-radius: 18px; padding: 24px; box-shadow: 0 24px 80px rgba(0,0,0,0.18); }
.modal-title { font-family: 'Lora', serif; font-size: 22px; color: var(--navy); margin-bottom: 18px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--navy); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.form-input, .form-select, .form-textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; font-size: 14px; font-family: 'DM Sans', sans-serif; }
.form-textarea { min-height: 120px; resize: vertical; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.empty-state { background: var(--card); border: 1px dashed var(--border); border-radius: 16px; padding: 40px 20px; text-align: center; color: var(--muted); }
.message { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }
.message-success { background: var(--sage-light); color: var(--sage); }
.message-error { background: var(--warm-light); color: var(--warm); }
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <a href="/dashboard/" class="nav-brand" style="text-decoration: none; color: inherit;">
      <svg class="nav-logo" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="13" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <circle cx="14" cy="14" r="6" fill="rgba(168,203,184,0.7)"/>
        <circle cx="14" cy="5" r="2.5" fill="#A8CBB8"/>
        <circle cx="22.5" cy="19" r="2.5" fill="#A8CBB8"/>
        <circle cx="5.5" cy="19" r="2.5" fill="#A8CBB8"/>
        <line x1="14" y1="8" x2="14" y2="14" stroke="#A8CBB8" stroke-width="1.2"/>
        <line x1="20.7" y1="17" x2="14" y2="14" stroke="#A8CBB8" stroke-width="1.2"/>
        <line x1="7.3" y1="17" x2="14" y2="14" stroke="#A8CBB8" stroke-width="1.2"/>
      </svg>
      <span>CareCircle</span>
    </a>
    <div class="nav-right">
      <div class="role-badge">{{ user_role }}</div>
      <a href="/dashboard/" class="nav-back">← Back to Dashboard</a>
    </div>
  </nav>

  <div class="page">
    <div class="header">
      <div>
        <div class="welcome-sub">Phase A extension · Health alerts</div>
        <div class="page-title">Alerts</div>
        <div class="page-copy">Admins can dismiss or edit alerts. Members can edit alerts and mark them as addressed. Demo access stays available so you can review the flow now.</div>
      </div>
    </div>

    <div id="message"></div>
    <div class="alerts-grid" id="alerts-grid">
      <div class="empty-state">Loading alerts…</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title">Edit alert</div>
    <form id="edit-form">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input class="form-input" id="alert-title" required />
      </div>
      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea class="form-textarea" id="alert-message" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Severity</label>
        <select class="form-select" id="alert-severity">
          <option value="info">Info</option>
          <option value="watch">Watch</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="alert-status">
          <option value="active">Active</option>
          <option value="addressed">Addressed</option>
          <option value="dismissed">Dismissed</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save alert</button>
      </div>
    </form>
  </div>
</div>

<script>
let alertsData = [];
let activeAlertId = null;

function showMessage(text, type = 'success') {
  const el = document.getElementById('message');
  el.className = `message message-${type}`;
  el.textContent = text;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function formatTime(value) {
  const date = new Date(value);
  const diffMs = Date.now() - date.getTime();
  const diffMinutes = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMinutes / 60);
  const diffDays = Math.floor(diffHours / 24);
  if (diffMinutes < 1) return 'just now';
  if (diffMinutes < 60) return `${diffMinutes}m ago`;
  if (diffHours < 24) return `${diffHours}h ago`;
  if (diffDays < 7) return `${diffDays}d ago`;
  return date.toLocaleDateString();
}

function severityClass(severity) {
  return `pill pill-${severity}`;
}

function statusClass(status) {
  return `pill pill-${status}`;
}

function renderAlerts() {
  const grid = document.getElementById('alerts-grid');
  if (!alertsData.length) {
    grid.innerHTML = '<div class="empty-state">No alerts yet.</div>';
    return;
  }

  grid.innerHTML = alertsData.map(alert => `
    <div class="alert-card">
      <div class="alert-top">
        <div>
          <div class="alert-title">${alert.title}</div>
          <div class="alert-meta">
            <span class="${severityClass(alert.severity)}">${alert.severity}</span>
            <span class="${statusClass(alert.status)}">${alert.status}</span>
          </div>
        </div>
        <div class="alert-time">Updated ${formatTime(alert.updated_at)}</div>
      </div>
      <div class="alert-message">${alert.message}</div>
      <div class="alert-foot">
        <div class="alert-time">
          Created by ${alert.created_by_name || 'CareCircle'} · ${alert.circle_name}
          ${alert.addressed_by_name ? ` · Addressed by ${alert.addressed_by_name}` : ''}
          ${alert.dismissed_by_name ? ` · Dismissed by ${alert.dismissed_by_name}` : ''}
        </div>
        <div class="alert-actions">
          ${alert.can_edit ? `<button class="btn btn-secondary" onclick="openEdit(${alert.id})">Edit</button>` : ''}
          ${alert.can_address && alert.status !== 'addressed' ? `<button class="btn btn-primary" onclick="updateAlert(${alert.id}, { status: 'addressed' })">Mark addressed</button>` : ''}
          ${alert.can_dismiss && alert.status !== 'dismissed' ? `<button class="btn btn-warm" onclick="updateAlert(${alert.id}, { status: 'dismissed' })">Dismiss</button>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

async function loadAlerts() {
  try {
    const response = await fetch('/api/alerts/');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    alertsData = await response.json();
    renderAlerts();
  } catch (error) {
    document.getElementById('alerts-grid').innerHTML = '<div class="empty-state">Failed to load alerts.</div>';
  }
}

function openEdit(alertId) {
  const alert = alertsData.find(item => item.id === alertId);
  if (!alert) return;
  activeAlertId = alertId;
  document.getElementById('alert-title').value = alert.title;
  document.getElementById('alert-message').value = alert.message;
  document.getElementById('alert-severity').value = alert.severity;
  document.getElementById('alert-status').value = alert.status;
  document.querySelector('#alert-status option[value="addressed"]').disabled = !alert.can_address;
  document.querySelector('#alert-status option[value="dismissed"]').disabled = !alert.can_dismiss;
  if (!alert.can_dismiss && document.getElementById('alert-status').value === 'dismissed') {
    document.getElementById('alert-status').value = 'active';
  }
  document.getElementById('edit-modal').classList.add('open');
}

function closeModal() {
  activeAlertId = null;
  document.getElementById('edit-modal').classList.remove('open');
}

async function updateAlert(alertId, payload) {
  try {
    const response = await fetch(`/api/alerts/${alertId}/`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!response.ok) {
      const data = await response.json();
      throw new Error(data.detail || `HTTP ${response.status}`);
    }
    showMessage('Alert updated.', 'success');
    closeModal();
    await loadAlerts();
  } catch (error) {
    showMessage(error.message || 'Unable to update alert.', 'error');
  }
}

document.getElementById('edit-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!activeAlertId) return;
  await updateAlert(activeAlertId, {
    title: document.getElementById('alert-title').value,
    message: document.getElementById('alert-message').value,
    severity: document.getElementById('alert-severity').value,
    status: document.getElementById('alert-status').value,
  });
});

loadAlerts();
</script>
</body>
</html>
