<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notifications — CareCircle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --sage: #4A7C6F;
  --sage-light: #E8F2EF;
  --sage-mid: #A8CBB8;
  --warm: #C67D5A;
  --warm-light: #F7EDE5;
  --navy: #1E3A4F;
  --muted: #8A96A3;
  --surface: #FAFAF8;
  --card: #FFFFFF;
  --border: rgba(74,124,111,0.15);
  --text: #1E2D3A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); }

.app { display: flex; flex-direction: column; min-height: 100vh; max-width: 800px; margin: 0 auto; padding: 0 0 40px; }

.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px; background: var(--navy);
  position: sticky; top: 0; z-index: 100;
}
.nav-brand { display: flex; align-items: center; gap: 10px; transition: opacity 0.2s; }
.nav-brand:hover { opacity: 0.8; }
.nav-logo { width: 28px; height: 28px; }
.nav-brand span { font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
.nav-back { background: rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; text-decoration: none; transition: background 0.2s; }
.nav-back:hover { background: rgba(255,255,255,0.3); }
.role-badge { background: var(--sage); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }

.page { padding: 32px 28px; }

.header { margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; }
.header-left { flex: 1; }
.welcome-sub { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.page-title { font-family: 'Lora', serif; font-size: 28px; font-weight: 600; color: var(--navy); margin-bottom: 8px; }

.badge { background: var(--sage-light); color: var(--sage); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }

.notifications-list { display: flex; flex-direction: column; gap: 12px; }

.notification-item {
  background: var(--card); border-radius: 12px; border: 1px solid var(--border);
  padding: 16px; cursor: pointer; transition: all 0.2s;
}
.notification-item:hover { border-color: var(--sage); background: #fafaf8; }
.notification-item.unread { background: var(--sage-light); border-color: var(--sage-mid); }

.notif-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.notif-title { font-size: 15px; font-weight: 600; color: var(--navy); }
.notif-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.notif-time { color: var(--muted); }
.notif-badge { background: var(--warm-light); color: var(--warm); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }

.notif-message { font-size: 14px; color: var(--slate); margin: 10px 0; line-height: 1.5; }
.notif-from { font-size: 12px; color: var(--muted); margin-top: 8px; }

.notif-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn-mark { background: none; border: none; color: var(--sage); cursor: pointer; font-size: 12px; font-weight: 500; padding: 0; }
.btn-mark:hover { color: var(--navy); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

#loading { text-align: center; color: var(--muted); padding: 20px; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--sage); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.slate { color: #4A5568; }
</style>
</head>
<body>

<div class="app">
  <nav class="nav">
    <a href="/dashboard/" class="nav-brand" style="text-decoration: none; color: inherit;">
      <svg class="nav-logo" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="13" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <circle cx="14" cy="14" r="6" fill="rgba(168,203,184,0.7)"/>
        <circle cx="14" cy="5" r="2.5" fill="#A8CBB8"/>
        <circle cx="22.5" cy="19" r="2.5" fill="#A8CBB8"/>
        <circle cx="5.5" cy="19" r="2.5" fill="#A8CBB8"/>
        <line x1="14" y1="8" x2="14" y2="14" stroke="#A8CBB8" stroke-width="1.2"/>
        <line x1="20.7" y1="17" x2="14" y2="14" stroke="#A8CBB8" stroke-width="1.2"/>
        <line x1="7.3" y1="17" x2="14" y2="14" stroke="#A8CBB8" stroke-width="1.2"/>
      </svg>
      <span>CareCircle</span>
    </a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="/profile/" class="nav-back" style="background: none; padding: 0; margin: 0;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="6" r="3" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" stroke-linecap="round"/></svg>
        </a>
        <div class="role-badge">{{ user_role }}</div>
        <a href="/dashboard/" class="nav-back">← Back to Dashboard</a>
      </div>
  </nav>

  <div class="page">
    <div class="header">
      <div class="header-left">
        <div class="welcome-sub">Messages from Circle Admins</div>
        <div class="page-title">Notifications</div>
      </div>
      <div id="unread-badge" class="badge" style="display: none;">0 unread</div>
    </div>

    <div class="notifications-list" id="notifications-list">
      <div id="loading"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script>
async function loadNotifications() {
  try {
    const response = await fetch('/api/notifications/');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const notifications = await response.json();
    renderNotifications(notifications);
  } catch (error) {
    console.error(error);
    document.getElementById('notifications-list').innerHTML = '<div class="empty-state">Failed to load notifications.</div>';
  }
}

function renderNotifications(notifications) {
  if (notifications.length === 0) {
    document.getElementById('notifications-list').innerHTML = '<div class="empty-state">No notifications yet.</div>';
    document.getElementById('unread-badge').style.display = 'none';
    return;
  }

  const unreadCount = notifications.filter(n => !n.read_at).length;
  if (unreadCount > 0) {
    document.getElementById('unread-badge').textContent = `${unreadCount} unread`;
    document.getElementById('unread-badge').style.display = 'inline-block';
  }

  let html = '';
  for (const notif of notifications) {
    const createdDate = new Date(notif.created_at);
    const timeStr = getTimeString(createdDate);
    const isUnread = !notif.read_at;
    
    html += `
      <div class="notification-item ${isUnread ? 'unread' : ''}">
        <div class="notif-header">
          <div class="notif-title">${escapeHtml(notif.title)}</div>
          <div class="notif-meta">
            <span class="notif-time">${timeStr}</span>
            ${isUnread ? '<span class="notif-badge">NEW</span>' : ''}
          </div>
        </div>
        <div class="notif-message">${escapeHtml(notif.message)}</div>
        <div class="notif-from">From <strong>${escapeHtml(notif.sent_by_name)}</strong> in <strong>${escapeHtml(notif.circle_name)}</strong></div>
        ${isUnread ? `<div class="notif-actions"><button class="btn-mark" onclick="markAsRead(${notif.id})">Mark as read</button></div>` : ''}
      </div>
    `;
  }
  document.getElementById('notifications-list').innerHTML = html;
}

function getTimeString(date) {
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffMins < 1) return 'just now';
  if (diffMins < 60) return `${diffMins}m ago`;
  if (diffHours < 24) return `${diffHours}h ago`;
  if (diffDays < 7) return `${diffDays}d ago`;
  return date.toLocaleDateString();
}

function escapeHtml(text) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}

async function markAsRead(notificationId) {
  try {
    const response = await fetch(`/api/notifications/${notificationId}/read/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    loadNotifications();
  } catch (error) {
    console.error(error);
  }
}

loadNotifications();
</script>

</body>
</html>
